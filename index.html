<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rescue</title>
    <meta
      name="description"
      content="A tiny archery game: cut the rope to rescue the person hanging from it, before your arrows run out."
    />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="visually-hidden">
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <h1 class="visually-hidden">Rescue</h1>
      <div id="board">
        <canvas id="game" aria-label="Archery rescue game"></canvas>
        <div id="hud" aria-hidden="true"></div>
        <div id="overlay" class="overlay" hidden>
          <img id="fail-meme" class="fail-meme" src="./loser.jpg" alt="" hidden />
          <button id="restart" type="button">RESTART</button>
        </div>
        <div id="card" class="card" hidden aria-hidden="true">
          <span class="card-title"></span>
          <span class="card-subtitle"></span>
        </div>
        <div id="start-screen" class="start-screen">
          <div class="start-card">
            <h2 class="game-title">RESCUE SHOT</h2>
            <button id="start-button" type="button" class="start-button">START CHALLENGE</button>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
